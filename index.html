<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>café rose</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- l'entête de la page -->
<header>
<div class="nav-container">
            <!-- le logo -->
<h1 class="logo">Café <span>Rose</span></h1>
            <!-- Menu -->
<nav>
<ul class="nav-links">
<li><a href="#">Acceuil</a></li>
<li><a href="#">Notre histoire</a></li>
<li><a href="#">Menu</a></li>
<li><a href="#">Commander</a></li>
<li><a href="#">Contacts</a></li>
                    
</ul>
</nav>
</div>
</header>   
    <!-- partie principale -->
<main>

       <!-- image de la page -->
<section class="hero">
<img src="photo.jpg" alt="image de présentation du café">
</section>

         <!-- section contenant le formulaire a gauche et la video a droite -->
<section class="content-section">
            <!-- Div qui contien le formulaire -->
<div class="form-section">
    <!-- tittre du formulaire --> <h2>Formulaire d'inscription</h2>
                
                <!-- formulaire -->
 <form action="">
 <label for="nom">Nom:</label>
 <input type="text" name="nom" id="nom" required>

<label for="prenom">Prenom:</label>
<input type="text" name="prenom" id="prenom" required>

<label for="adresse">Adresse:</label>
<input type="text" name="adresse" id="adresse" required>

<label for="telephone">Téléphone:</label>
<input type="text" name="telephone" id="telephone" required>

<label for="email">Email:</label>
<input type="email" name="email" id="email" required>

<label for="password">Mot de passe:</label>
<input type="password" name="password" id="password" required>

<label for="confirme">Confirmé mot de passe:</label>
<input type="password" name="confirme" id="confirme" required>

<button type="submit">S'inscrire</button>
                 </form>
</div>
     <!-- Div qui contien la video -->
<div class="video-section">
<video src="video.mp4" controls muted autoplay>votre navigateur ne supporte pas ce format</video
</div>

</section>
</main>

     <!-- footer pied de la page -->
<footer>
<p>Ce site a été conçu par Fifi Guenolcia étudiante de D-CLIC</p>
</footer>

</body>
</html>
